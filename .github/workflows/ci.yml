name: Check

on:
  push:
    branches: [main, 'ops/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Bundle (wrangler dry run)
        run: |
          cp wrangler.toml.example wrangler.toml
          sed -i 's/PASTE_KV_NAMESPACE_ID_HERE/00000000000000000000000000000000/; s/PASTE_YNAB_BUDGET_ID_HERE/00000000-0000-0000-0000-000000000000/' wrangler.toml
          npx wrangler deploy --dry-run --outdir dist

  browser:
    # Playwright's Chromium doesn't support Ubuntu 26.04 yet (ubuntu-latest since Oct 2026).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser tests (dashboard and setup pages, desktop and phone)
        run: npm run test:browser
