name: Production health monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health-monitor
  cancel-in-progress: true

jobs:
  health:
    name: Authenticated production health check
    # Opt-in: does nothing until the repository variable ENABLE_PRODUCTION_HEALTH_CHECK
    # is "true" (Settings -> Secrets and variables -> Actions -> Variables). Copies of this
    # repo, and anyone who hasn't set it up, get no failing runs every 15 minutes.
    if: ${{ vars.ENABLE_PRODUCTION_HEALTH_CHECK == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check production Worker
        env:
          WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node scripts/check-production-health.mjs
